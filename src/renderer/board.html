<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; font-src 'self'; script-src 'self'; img-src 'self' data:">
  <title>공부방 현황판</title>
  <link rel="stylesheet" href="../../node_modules/pretendard/dist/web/variable/pretendardvariable-dynamic-subset.css">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="board.css">
</head>
<body>
  <div class="stage" id="stage">
    <header class="top" id="top">
      <div class="date">
        <div class="row1"><span class="d" id="date-d"></span><span class="w" id="date-w"></span></div>
        <div class="hours" id="hours"></div>
      </div>
      <div class="strip" id="strip" aria-label="오늘 수업 시간대"></div>
      <div class="clockbox">
        <div class="clock" id="clock" aria-label="현재 시각"></div>
        <div class="sync" id="sync"></div>
      </div>
    </header>
    <main class="main" id="main"></main>
    <footer class="foot" id="foot"></footer>
    <div class="notice" id="notice" hidden></div>
  </div>
  <script src="board.js"></script>
</body>
</html>
