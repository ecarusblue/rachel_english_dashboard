<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'">
  <title>현황판 설정</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <h1>현황판 설정</h1>

  <section>
    <h2>Supabase 연결</h2>
    <label>프로젝트 URL
      <input id="url" type="url" placeholder="https://xxxx.supabase.co" autocomplete="off" spellcheck="false">
    </label>
    <label>공개용 키 (anon / publishable)
      <input id="key" type="password" placeholder="저장된 키 유지(비워 두면 그대로)" autocomplete="off" spellcheck="false">
    </label>
    <p class="hint">secret / service_role 키는 사용할 수 없습니다.</p>
  </section>

  <section>
    <h2>선생님 계정</h2>
    <p id="auth-state" class="state"></p>
    <label>이메일 <input id="email" type="email" autocomplete="username" spellcheck="false"></label>
    <label>비밀번호 <input id="password" type="password" autocomplete="current-password"></label>
    <div class="row">
      <button id="login" type="button">로그인</button>
      <button id="logout" type="button" class="ghost">로그아웃</button>
    </div>
    <p class="hint">비밀번호는 저장하지 않습니다. 로그인 세션만 Windows 보안 저장소(DPAPI)로 암호화해 보관합니다.</p>
  </section>

  <section>
    <h2>화면</h2>
    <label>현황판을 띄울 디스플레이
      <select id="display"></select>
    </label>
    <label>갱신 주기 (초)
      <input id="refresh" type="number" min="15" max="3600" step="5">
    </label>
    <label>학생 이름 표시
      <select id="nameMode">
        <option value="full">전체 이름</option>
        <option value="surname">성 + ○○</option>
        <option value="given">이름만</option>
        <option value="initial">초성</option>
      </select>
    </label>
    <label class="check"><input id="autoLaunch" type="checkbox"> Windows 시작 시 자동 실행 (설치본에서만 적용)</label>
  </section>

  <p id="msg" class="msg" role="status"></p>

  <div class="row footer">
    <button id="save" type="button">저장</button>
    <button id="close" type="button" class="ghost">닫기</button>
    <button id="quit" type="button" class="danger">현황판 종료</button>
  </div>
  <script src="settings.js"></script>
</body>
</html>
